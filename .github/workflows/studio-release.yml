name: Publish signed Studio catalog

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: "Reviewed snapshot commit SHA from feature/studio-catalog-integration"
        required: true
        type: string
      version:
        description: "New strictly increasing catalog version"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: studio-catalog-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: studio-publication
    steps:
      - name: Checkout approved main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Import only the reviewed Admin snapshot
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Expected full 40-character commit SHA"; exit 1; }
          git fetch --no-tags origin feature/studio-catalog-integration
          git cat-file -e "$SNAPSHOT_SHA^{commit}"
          git merge-base --is-ancestor "$SNAPSHOT_SHA" FETCH_HEAD || {
            echo "Snapshot commit is not in the approved review branch"; exit 1;
          }
          mkdir -p publication
          git show "$SNAPSHOT_SHA:publication/admin-settings.json" > publication/admin-settings.json
          test -s publication/admin-settings.json
          echo "Imported only snapshot JSON; no application code from review branch was merged."
      - name: Validate input and approved snapshot
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid version"; exit 1; }
          test -s publication/admin-settings.json
          python3 - <<'PY'
          import json, os, pathlib
          version = int(os.environ["VERSION"])
          source = pathlib.Path("publication/admin-settings.json").read_text(encoding="utf-8")
          if len(source.encode("utf-8")) > 262144:
              raise SystemExit("Snapshot too large")
          snapshot = json.loads(source)
          if snapshot.get("schema") != 2 or snapshot.get("kind") != "mazda6gh-admin-settings":
              raise SystemExit("Invalid snapshot")
          stores = snapshot.get("stores")
          if not isinstance(stores, dict) or any(not isinstance(stores.get(k), dict) for k in
              ("run35_settings", "studio_admin_rows", "studio_custom_modules")):
              raise SystemExit("Missing required stores")
          published = pathlib.Path("publication/studio-published-settings.json")
          if published.exists():
              old = json.loads(published.read_text(encoding="utf-8"))
              if old.get("kind") != "mazda6gh-published-settings" or type(old.get("version")) is not int:
                  raise SystemExit("Existing published catalog invalid")
              if version <= old["version"]:
                  raise SystemExit("Version must increase")
          PY
      - name: Sign approved snapshot with protected RSA key
        env:
          VERSION: ${{ inputs.version }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.STUDIO_CATALOG_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHER_PRIVATE_KEY"
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$PUBLISHER_PRIVATE_KEY" > "$key_file"
          python3 tools/sign_full_catalog.py \
            --input publication/admin-settings.json \
            --output publication/studio-published-settings.json \
            --version "$VERSION" \
            --private-key "$key_file"
          openssl pkey -in "$key_file" -pubout -out /tmp/studio-publisher-public.pem
          python3 - <<'PY'
          import base64, json, pathlib, subprocess, tempfile
          doc=json.loads(pathlib.Path("publication/studio-published-settings.json").read_text(encoding="utf-8"))
          message=("MAZDA6GH-SETTINGS-V2\n"+str(doc["version"])+"\n"+doc["snapshot_payload"]).encode("utf-8")
          with tempfile.TemporaryDirectory() as directory:
              m=pathlib.Path(directory)/"message"
              sig=pathlib.Path(directory)/"signature"
              m.write_bytes(message)
              sig.write_bytes(base64.b64decode(doc["signature"],validate=True))
              subprocess.run(["openssl","dgst","-sha256","-verify","/tmp/studio-publisher-public.pem",
                  "-signature",str(sig),str(m)],check=True)
          PY
      - name: Commit and publish to main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication/studio-published-settings.json
          git commit -m "Publish signed Studio catalog v$VERSION"
          git push origin HEAD:main
      - name: Upload signed release for audit
        uses: actions/upload-artifact@v4
        with:
          name: studio-signed-release
          path: publication/studio-published-settings.json
          retention-days: 30
