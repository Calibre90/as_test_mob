name: OBD Studio Test APK
on:
  workflow_dispatch:
  push:
    branches:
      - obd-studio
    paths:
      - 'app/**'
      - '.github/workflows/build-obd-studio.yml'
permissions:
  contents: read
jobs:
  build-obd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OBD development branch
        uses: actions/checkout@v4
        with:
          ref: obd-studio
      - name: Install existing Studio UI artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          unzip -q Mazda6GH_WhiteRed_Complete_UI_Assets.zip -d /tmp/mazda_assets
          find /tmp/mazda_assets/Mazda6GH_WhiteRed_Production_Assets -name '*.png' -exec cp {} app/src/main/res/drawable-nodpi/ \;
          unzip -q -j Mazda6GH_Header_and_Lock_Assets.zip '*.png' -d app/src/main/res/drawable-nodpi/
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Calibre90/Mazda6GH-AsBuilt-Studio-Android/main/assets/splash_studio.png' -o app/src/main/res/drawable-nodpi/splash_studio.png
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Calibre90/Mazda6GH-AsBuilt-Studio-Android/main/assets/icon_studio.png' -o app/src/main/res/drawable-nodpi/icon_studio.png
      - name: Prepare isolated OBD application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          assert 'applicationId = "com.calibre90.astestmob"' in s
          s = s.replace('applicationId = "com.calibre90.astestmob"', 'applicationId = "com.calibre90.obdstudio.test"', 1)
          gradle.write_text(s)
          import xml.etree.ElementTree as ET
          manifest = Path('app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          assert app is not None, 'Application element missing'
          conn = next((a for a in app.findall('activity') if a.get(ns+'name') == '.obd.ObdConnectionActivity'), None)
          assert conn is not None, 'OBD connection activity missing'
          main = next((a for a in app.findall('activity') if a.get(ns+'name') == '.MainActivity'), None)
          assert main is not None, 'Original Studio activity missing'
          for intent in list(main.findall('intent-filter')):
              if any(a.get(ns+'name') == 'android.intent.action.MAIN' for a in intent.findall('action')):
                  main.remove(intent)
          main.set(ns+'exported', 'false')
          dashboard = ET.SubElement(app, 'activity', {ns+'name': '.obd.ObdDashboardActivity', ns+'exported': 'true', ns+'label': 'OBD Studio Test'})
          intent = ET.SubElement(dashboard, 'intent-filter')
          ET.SubElement(intent, 'action', {ns+'name': 'android.intent.action.MAIN'})
          ET.SubElement(intent, 'category', {ns+'name': 'android.intent.category.LAUNCHER'})
          app.set(ns+'label', 'Mazda 6 GH OBD Studio Test')
          tree.write(manifest, encoding='unicode', xml_declaration=True)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated OBD Studio debug APK
        run: gradle :app:assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mazda6GH-OBD-Studio-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
